name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      JOB_EMAIL_ACTION_SECRET: ci-job-email-action-secret-at-least-32-characters
      OWNER_LINK_SIGNING_SECRET: ci-owner-link-signing-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
